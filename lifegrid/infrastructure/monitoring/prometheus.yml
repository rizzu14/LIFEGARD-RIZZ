global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: lifegrid
    environment: production

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ['api-gateway:4000']
    metrics_path: /metrics

  - job_name: ingestion-service
    static_configs:
      - targets: ['ingestion-service:4001']

  - job_name: ai-processing-service
    static_configs:
      - targets: ['ai-processing-service:4002']

  - job_name: dispatch-service
    static_configs:
      - targets: ['dispatch-service:4003']

  - job_name: notification-service
    static_configs:
      - targets: ['notification-service:4004']

  - job_name: ai-engine
    static_configs:
      - targets: ['ai-engine:5001']
    metrics_path: /metrics

  - job_name: satellite-service
    static_configs:
      - targets: ['satellite-service:5002']
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
