worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Security headers ────────────────────────────────────────
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  server_tokens off;

  # ── Compression ─────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # ── Rate limiting ────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=emergency:10m rate=5r/s;

  # ── Upstream services ────────────────────────────────────────
  upstream api_gateway {
    server api-gateway:4000;
    keepalive 32;
  }

  upstream citizen_ui {
    server citizen-ui:80;
  }

  upstream operator_ui {
    server operator-ui:80;
  }

  # ── Citizen UI ───────────────────────────────────────────────
  server {
    listen 80;
    server_name lifegrid.gov www.lifegrid.gov;

    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }

    location / {
      proxy_pass http://citizen_ui;
      proxy_set_header Host $host;
    }
  }

  # ── Operator Command Center ──────────────────────────────────
  server {
    listen 80;
    server_name command.lifegrid.gov ops.lifegrid.gov;

    # Restrict to internal network in production
    # allow 10.0.0.0/8;
    # deny all;

    location /api/ {
      limit_req zone=api burst=100 nodelay;
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }

    location / {
      proxy_pass http://operator_ui;
      proxy_set_header Host $host;
    }
  }
}
